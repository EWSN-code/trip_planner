<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f7f6" />
    <title>Travel Planner</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <header>
      <div>
        <small>Travel Planner v2</small>
        <h1>旅行計画</h1>
      </div>
      <div class="cloud-status">
        <span id="syncStatus">ローカル</span><span id="userEmail"></span
        ><button class="sub" id="logoutBtn" hidden>ログアウト</button>
      </div>
      <div class="actions">
        <button class="sub" id="themeBtn">テーマ</button
        ><button class="sub" id="importBtn">読込</button
        ><button class="sub" id="exportBtn">書出</button
        ><button id="newTripBtn">＋新しい旅行</button
        ><input id="importInput" type="file" accept="application/json" hidden />
      </div>
    </header>
    <nav>
      <button id="listNav" class="active">旅行一覧</button
      ><button id="detailNav" disabled>旅程</button
      ><a id="printLink" class="disabled">印刷</a>
    </nav>
    <main>
      <section id="listView">
        <div class="compare-section-head">
          <h2>旅行一覧</h2>
          <div class="actions">
            <label class="compare-toggle"
              ><input id="compareModeToggle" type="checkbox" />比較モード</label
            ><button id="compareBtn" class="sub" type="button" disabled>
              比較
            </button>
          </div>
        </div>
        <p class="muted">旅行の作成、複製、編集ができます。</p>
        <div id="tripGrid" class="trip-grid"></div>
      </section>
      <section id="detailView" hidden>
        <div class="detail-head">
          <div>
            <button class="text" id="backBtn">← 旅行一覧</button>
            <h2 id="tripTitle"></h2>
            <p id="tripDates" class="muted"></p>
          </div>
          <div class="actions">
            <button class="sub" id="viewModeBtn">旅程を編集</button
            ><button class="sub" id="editTripBtn">基本情報</button
            ><button id="addItemBtn">＋旅程追加</button>
          </div>
        </div>
        <div class="top-summary">
          <div><span>予定合計</span><strong id="totalAmount">¥0</strong></div>
          <div><span>項目数</span><strong id="itemCount">0</strong></div>
          <div><span>日数</span><strong id="dayCount">0</strong></div>
        </div>
        <div class="budget-grid">
          <section>
            <h3>支払方法別</h3>
            <div id="paymentSummary"></div>
          </section>
          <section>
            <h3>科目別</h3>
            <div id="categorySummary"></div>
          </section>
        </div>
        <div id="dayTabs" class="tabs"></div>
        <div id="timeline" class="timeline"></div>
        <button id="addAtEndBtn" class="add-at-end" type="button">
          ＋ この日の旅程を追加
        </button>
      </section>
      <section id="compareView" hidden>
        <div class="detail-head">
          <div>
            <button class="text" id="compareBackBtn" type="button">
              ← 旅行一覧
            </button>
            <h2>旅行の比較</h2>
          </div>
        </div>
        <div id="compareHeader" class="compare-header"></div>
        <div id="compareDays"></div>
      </section>
    </main>
    <dialog id="themeDialog">
      <form id="themeForm">
        <div class="dialog-head">
          <div>
            <small>表示設定</small>
            <h2>カラーテーマ</h2>
          </div>
          <button type="button" class="icon" id="themeCloseBtn">×</button>
        </div>
        <label
          ><select id="themeSelect">
            <option value="system">端末設定に合わせる</option>
            <option value="light">Journey Light</option>
            <option value="dark">Night Travel</option>
            <option value="paper">Warm Paper</option>
          </select></label
        >
        <div class="theme-preview">
          <button type="button" class="theme-choice" data-theme-choice="light">
            <span class="theme-swatch sw-light"></span
            ><strong>Journey Light</strong
            ><small>明るく読みやすい標準</small></button
          ><button type="button" class="theme-choice" data-theme-choice="dark">
            <span class="theme-swatch sw-dark"></span
            ><strong>Night Travel</strong><small>夜間向けダーク</small></button
          ><button type="button" class="theme-choice" data-theme-choice="paper">
            <span class="theme-swatch sw-paper"></span
            ><strong>Warm Paper</strong><small>旅のしおり風</small>
          </button>
        </div>
        <label class="theme-device"
          ><input
            id="themeDeviceOnly"
            type="checkbox"
          />この端末だけに適用</label
        >
        <p class="muted">
          オフの場合はSupabase設定としてPCとスマホへ同期します。
        </p>
        <div class="dialog-actions">
          <button type="button" class="sub" id="themeCancelBtn">
            キャンセル</button
          ><button type="submit">適用</button>
        </div>
      </form>
    </dialog>
    <dialog id="tripDialog">
      <form id="tripForm">
        <div class="dialog-head">
          <h2 id="tripDialogTitle"></h2>
          <button type="button" class="icon close">×</button>
        </div>
        <input id="tripId" type="hidden" /><label
          >旅行名<input id="tripName" required
        /></label>
        <div class="cols">
          <label>開始日<input id="startDate" type="date" /></label
          ><label>終了日<input id="endDate" type="date" /></label>
        </div>
        <label>同行者（カンマ区切り）<input id="travelers" /></label>
        <div class="dialog-actions">
          <button type="button" class="sub close">キャンセル</button
          ><button>保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="addMenuDialog">
      <form>
        <div class="dialog-head">
          <div>
            <small>旅程追加</small>
            <h2>追加方法を選択</h2>
          </div>
          <button type="button" class="icon" id="addMenuClose">×</button>
        </div>
        <div class="add-menu-grid">
          <button
            type="button"
            class="add-menu-card featured"
            data-add-mode="route"
          >
            <strong>🚆 移動をまとめて追加</strong
            ><small>出発、列車、乗換、到着を一度に入力</small></button
          ><button type="button" class="add-menu-card" data-add-mode="activity">
            <strong>📍 観光・予定</strong
            ><small>場所と時刻を追加</small></button
          ><button type="button" class="add-menu-card" data-add-mode="food">
            <strong>🍽️ 食事</strong><small>店舗と費用を追加</small></button
          ><button type="button" class="add-menu-card" data-add-mode="hotel">
            <strong>🏨 宿泊</strong><small>宿泊先を追加</small>
          </button>
        </div>
        <details>
          <summary>詳細追加</summary>
          <div class="add-detail-buttons">
            <button type="button" class="sub" data-add-mode="station">駅</button
            ><button type="button" class="sub" data-add-mode="transport">
              移動</button
            ><button type="button" class="sub" data-add-mode="transfer">
              乗換
            </button>
          </div>
        </details>
      </form>
    </dialog>
    <dialog id="routeDialog" class="route-dialog">
      <form id="routeForm">
        <div class="dialog-head">
          <div>
            <small>ROUTE WIZARD</small>
            <h2>移動をまとめて追加</h2>
          </div>
          <button type="button" class="icon" id="routeCloseBtn">×</button>
        </div>
        <input id="routeInsertIndex" type="hidden" value="-1" />
        <div class="cols">
          <label
            >追加する日<input
              id="routeDay"
              type="number"
              min="1"
              value="1" /></label
          ><label>出発地点<input id="routeOrigin" required /></label>
        </div>
        <div class="cols">
          <label>出発時刻<input id="routeOriginTime" type="time" /></label
          ><label>出発番線・乗り場<input id="routeOriginPoint" /></label>
        </div>
        <label
          >出発地点の構内図URL<input id="routeOriginMap" type="url"
        /></label>
        <div id="routeSegments" class="route-segments"></div>
        <button type="button" class="sub" id="addRouteSegmentBtn">
          ＋ 乗換区間を追加
        </button>
        <div class="dialog-actions">
          <button type="button" class="sub" id="routeCancelBtn">
            キャンセル</button
          ><button type="submit">経路を追加</button>
        </div>
      </form>
    </dialog>
    <dialog id="itemDialog">
      <form id="itemForm">
        <div class="dialog-head">
          <h2 id="itemDialogTitle"></h2>
          <button type="button" class="icon close">×</button>
        </div>
        <div class="cols">
          <label>日<input id="itemDay" type="number" min="1" value="1" /></label
          ><label
            >種類<select id="itemType">
              <option value="activity">観光・予定</option>
              <option value="food">食事</option>
              <option value="hotel">宿泊</option>
              <option value="station">駅・停留所</option>
              <option value="transport">移動</option>
              <option value="transfer">乗換</option>
            </select></label
          >
        </div>
        <div id="itemFields"></div>
        <details>
          <summary>費用明細</summary>
          <div id="expenseRows"></div>
          <button type="button" class="sub small" id="addExpenseBtn">
            ＋費用
          </button>
        </details>
        <label
          >メモ（1行1件）<textarea id="itemNotes" rows="3"></textarea>
        </label>
        <details>
          <summary>地図・構内図</summary>
          <label>場所・住所<input id="mapQuery" /></label
          ><label>公式構内図URL<input id="stationMapUrl" type="url" /></label>
        </details>
        <details>
          <summary>予約管理</summary>
          <label class="check"
            ><input id="reservationRequired" type="checkbox" />予約が必要</label
          >
          <div class="cols">
            <label
              >予約開始日時<input
                id="reservationOpenAt"
                type="datetime-local" /></label
            ><label
              >状態<select id="reservationStatus">
                <option value="not_open">受付開始前</option>
                <option value="available">未予約</option>
                <option value="reserved">予約済み</option>
                <option value="cancelled">取消済み</option>
                <option value="unavailable">予約不可</option>
              </select></label
            >
          </div>
          <label>予約ページURL<input id="reservationUrl" type="url" /></label>
        </details>
        <div class="dialog-actions">
          <button type="button" class="sub close">キャンセル</button
          ><button>保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="actualDialog">
      <form id="actualForm">
        <div class="dialog-head">
          <div>
            <small>QUICK RECORD</small>
            <h2 id="actualTitle">実績を入力</h2>
          </div>
          <button type="button" class="icon" id="actualCloseBtn">×</button>
        </div>
        <input id="actualItemId" type="hidden" />
        <div id="actualRows"></div>
        <div class="actual-total">
          <span>実績合計</span><strong id="actualTotal">¥0</strong>
        </div>
        <div class="dialog-actions">
          <button type="button" class="sub" id="actualCancelBtn">
            キャンセル</button
          ><button type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <button
      id="floatingAddBtn"
      class="floating-add"
      type="button"
      aria-label="旅程を追加"
      hidden
    >
      ＋
    </button>
    <dialog id="authDialog" class="auth-dialog">
      <form id="authForm">
        <div class="dialog-head">
          <div>
            <small>プライベート同期</small>
            <h2>ログイン</h2>
          </div>
        </div>
        <p class="muted">旅行データはSupabaseへ非公開保存されます。</p>
        <label
          >メールアドレス<input
            id="authEmail"
            type="email"
            autocomplete="email"
            required /></label
        ><label
          >パスワード<input
            id="authPassword"
            type="password"
            minlength="6"
            required
        /></label>
        <p id="authMessage" class="muted"></p>
        <div class="dialog-actions">
          <button type="button" class="sub" id="signupBtn">
            新規アカウント作成</button
          ><button type="submit">ログイン</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
