<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7a0019"><title>Travel Planner</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="authPlaceholder" hidden></div>
<header class="app-header"><div><p class="eyebrow">Travel Planner v2</p><h1 id="appTitle">旅行計画</h1><p id="appSubtitle" class="muted"></p></div><div class="header-actions"><button class="ghost" id="importBtn">読込</button><button class="ghost" id="exportBtn">書出</button><button id="newTripBtn">＋ 新しい旅行</button><input id="importInput" type="file" accept="application/json" hidden></div></header>
<nav class="app-nav"><button id="showTripsBtn" class="nav-btn active">旅行一覧</button><button id="showDetailBtn" class="nav-btn" disabled>旅程</button><a id="printLink" class="nav-link disabled" href="#">印刷</a></nav>
<main id="app"><section id="tripListView"><div class="section-head"><div><h2>旅行一覧</h2><p class="muted">旅行を選択、複製、編集できます。</p></div></div><div id="tripGrid" class="trip-grid"></div></section>
<section id="tripDetailView" hidden><div class="detail-head"><div><button class="text-btn" id="backBtn">← 旅行一覧</button><h2 id="tripTitle"></h2><p id="tripDates" class="muted"></p></div><div class="detail-actions"><button class="ghost" id="editTripBtn">基本情報</button><button id="addItemBtn">＋ 旅程を追加</button></div></div><section class="summary"><div><span>予定合計</span><strong id="totalAmount">¥0</strong></div><div><span>項目数</span><strong id="itemCount">0</strong></div><div><span>日数</span><strong id="dayCount">0</strong></div></section><div id="dayTabs" class="day-tabs"></div><div id="timeline" class="timeline"></div></section></main>
<dialog id="tripDialog"><form method="dialog" id="tripForm" class="dialog-form"><div class="dialog-head"><h2 id="tripDialogTitle">旅行</h2><button value="cancel" class="icon-btn" aria-label="閉じる">×</button></div><input type="hidden" id="tripId"><label>旅行名<input id="tripName" required></label><div class="two-col"><label>開始日<input id="startDate" type="date"></label><label>終了日<input id="endDate" type="date"></label></div><label>同行者（カンマ区切り）<input id="travelers"></label><div class="dialog-actions"><button value="cancel" class="ghost">キャンセル</button><button id="saveTripBtn" value="default">保存</button></div></form></dialog>
<dialog id="itemDialog"><form method="dialog" id="itemForm" class="dialog-form wide"><div class="dialog-head"><h2 id="itemDialogTitle">旅程を追加</h2><button value="cancel" class="icon-btn">×</button></div><input type="hidden" id="editingItemId"><div class="two-col"><label>日<input id="itemDay" type="number" min="1" value="1" required></label><label>種類<select id="itemType"><option value="activity">観光・予定</option><option value="food">食事</option><option value="station">駅・停留所</option><option value="transport">移動</option><option value="transfer">乗換</option><option value="hotel">宿泊</option></select></label></div><div id="itemFields"></div><details><summary>費用を追加</summary><div id="expenseRows"></div><button type="button" class="ghost small" id="addExpenseBtn">＋ 費用明細</button></details><label>メモ（1行1件）<textarea id="itemNotes" rows="3"></textarea></label><div class="dialog-actions"><button value="cancel" class="ghost">キャンセル</button><button id="saveItemBtn" value="default">保存</button></div></form></dialog>
<div id="toast" class="toast" hidden></div><script type="module" src="js/app.js"></script></body></html>
